name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AmyNitaMenu.zip
      - name: Semak zip ada kod muzik
        run: grep -q MediaPlayer AmyNitaMenu/app/src/main/java/com/example/amynita/MainActivity.java || (echo "ZIP LAMA - tiada kod muzik" && exit 1)
      - run: mkdir -p AmyNitaMenu/app/src/main/res/raw && cp Record_*.mp3 AmyNitaMenu/app/src/main/res/raw/lagu.mp3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug
        working-directory: AmyNitaMenu
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AmyNitaMenu/app/build/outputs/apk/debug/app-debug.apk
